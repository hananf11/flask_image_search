name: CI/CD

on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.8", "3.11", "3.12", "3.13"]

    name: Test (Python ${{ matrix.python-version }})

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: python${{ matrix.python-version }}-pip-${{ hashFiles('pyproject.toml') }}

      - name: Install PyTorch (CPU-only)
        run: pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu

      - name: Install package and dev deps
        run: pip install -e ".[dev]"

      - name: Lint with ruff
        run: ruff check flask_image_search tests

      - name: Test with pytest
        run: pytest

  publish:
    runs-on: ubuntu-latest
    name: Publish to PyPI
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    environment: pypi
    permissions:
      id-token: write   # OIDC trusted publishing -- no stored credentials needed
      contents: write   # creating the GitHub release

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build
        run: pip install build

      - name: Build
        run: python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
