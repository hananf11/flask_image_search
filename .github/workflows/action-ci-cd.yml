name: CI/CD

on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
        # "latest" resolves the current dependency stack (Flask 3 line);
        # "min" pins the floor we advertise (Flask 2 / Flask-SQLAlchemy 2.5 /
        # SQLAlchemy 1.4 / Werkzeug 2) so the package keeps dropping into legacy
        # Flask 2 apps like NZVR without forcing a framework upgrade.
        deps: ["latest", "min"]

    name: Test (Python ${{ matrix.python-version }}, ${{ matrix.deps }} deps)

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: python${{ matrix.python-version }}-${{ matrix.deps }}-pip-${{ hashFiles('pyproject.toml') }}

      - name: Upgrade pip (PEP 735 dependency-groups need pip >= 25.1)
        run: python -m pip install --upgrade "pip>=25.1"

      - name: Install PyTorch (CPU-only)
        run: pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu

      - name: Pin minimum supported dependency stack
        if: matrix.deps == 'min'
        run: pip install "Flask<3" "Flask-SQLAlchemy<3" "Werkzeug<3" "SQLAlchemy<2"

      - name: Install package (min deps -- keep the pinned floor)
        if: matrix.deps == 'min'
        run: pip install -e . --no-deps && pip install pytest

      - name: Install package and dev deps (latest)
        if: matrix.deps == 'latest'
        run: pip install -e . --group dev

      - name: Lint with ruff
        if: matrix.deps == 'latest'
        run: ruff check

      - name: Test with pytest
        run: pytest

  publish:
    runs-on: ubuntu-latest
    name: Publish to PyPI
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    environment: pypi
    permissions:
      id-token: write   # OIDC trusted publishing -- no stored credentials needed
      contents: write   # creating the GitHub release

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build
        run: pip install build

      - name: Build
        run: python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
