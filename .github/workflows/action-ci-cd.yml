name: CI/CD

on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
        # "latest" resolves the current dependency stack (Flask 3 line);
        # "min" pins the floor we advertise (Flask 2 / Flask-SQLAlchemy 2.5 /
        # SQLAlchemy 1.4 / Werkzeug 2) so the package keeps dropping into legacy
        # Flask 2 apps like NZVR without forcing a framework upgrade.
        deps: ["latest", "min"]

    name: Test (Python ${{ matrix.python-version }}, ${{ matrix.deps }} deps)

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: python${{ matrix.python-version }}-${{ matrix.deps }}-pip-${{ hashFiles('pyproject.toml') }}

      - name: Upgrade pip (PEP 735 dependency-groups need pip >= 25.1)
        run: python -m pip install --upgrade "pip>=25.1"

      - name: Install PyTorch (CPU-only)
        run: pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu

      - name: Pin minimum supported dependency stack
        if: matrix.deps == 'min'
        run: pip install "Flask<3" "Flask-SQLAlchemy<3" "Werkzeug<3" "SQLAlchemy<2"

      - name: Install package (min deps -- keep the pinned floor)
        if: matrix.deps == 'min'
        run: pip install -e . --no-deps && pip install pytest

      - name: Install package and dev deps (latest)
        if: matrix.deps == 'latest'
        run: pip install -e . --group dev

      - name: Lint with ruff
        if: matrix.deps == 'latest'
        run: ruff check

      - name: Test with pytest
        run: pytest

  docs:
    runs-on: ubuntu-latest
    name: Build docs
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: docs-pip-${{ hashFiles('pyproject.toml') }}

      - name: Upgrade pip (PEP 735 dependency-groups need pip >= 25.1)
        run: python -m pip install --upgrade "pip>=25.1"

      # autodoc imports the package, which pulls in torch -- install the CPU
      # wheel so the docs job doesn't drag down a multi-GB CUDA build.
      - name: Install PyTorch (CPU-only)
        run: pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu

      - name: Install package and docs deps
        run: pip install -e . --group docs

      # -W turns warnings (broken cross-refs, missing autodoc targets, bad
      # directives) into failures; --keep-going reports every one in a single run
      # instead of stopping at the first. This is what keeps Read the Docs green.
      - name: Build docs
        run: sphinx-build -b html -W --keep-going docs docs/_build/html

  publish:
    runs-on: ubuntu-latest
    name: Publish to PyPI
    needs: [test, docs]
    if: startsWith(github.ref, 'refs/tags/v')
    environment: pypi
    permissions:
      id-token: write   # OIDC trusted publishing -- no stored credentials needed
      contents: write   # creating the GitHub release

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history so the main-ancestry guard below can run

      # PEP 440 prerelease tags (v2.0.0rc1 / v2.0.0b1 / v2.0.0a1 / v2.0.0.dev1).
      # PyPI/pip already treat the version string itself as a prerelease, so
      # plain `pip install` ignores it; this only labels the GitHub Release.
      - name: Determine if prerelease
        id: prerelease
        run: |
          if [[ "${GITHUB_REF_NAME}" =~ (a|b|rc)[0-9]+$ || "${GITHUB_REF_NAME}" =~ \.dev[0-9]+$ ]]; then
            echo "value=true" >> "$GITHUB_OUTPUT"
          else
            echo "value=false" >> "$GITHUB_OUTPUT"
          fi

      # Final (non-prerelease) versions must ship from main. Git tags aren't
      # tied to a branch, so verify the tagged commit is reachable from
      # origin/main -- an accidental vX.Y.Z tag on a feature branch fails here
      # instead of publishing. Prereleases may ship from any branch (rc testing).
      - name: Require final releases on main
        if: steps.prerelease.outputs.value == 'false'
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Final release tag ${GITHUB_REF_NAME} is not on main; refusing to publish."
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build
        run: pip install build

      - name: Build
        run: python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          prerelease: ${{ steps.prerelease.outputs.value }}
